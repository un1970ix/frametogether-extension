name: Publish Extension

on:
  push:
    tags: [ '*.*.*' ]
  workflow_dispatch:
    inputs:
      store:
        description: Choose the store to publish.
        type: choice
        options: [both, chrome, firefox]
        default: both

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: store-release
    env:
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate Store Configuration
        run: bun scripts/publish-chrome.ts --check

      - name: Audit Dependencies
        id: audit
        continue-on-error: true
        run: bun audit --audit-level=moderate

      - name: Report Audit Failure
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit failed. Review the audit output.'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify Tag Matches package.json
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          pkg="$(bun --print 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg"

      - name: Build Chrome Package
        run: |
          set -euo pipefail
          bun run build
          (cd dist && zip -qr ../chrome.zip .)

      - name: Build Firefox Package
        run: |
          set -euo pipefail
          bun run build:firefox

      - name: Lint Firefox Package
        run: bun run lint:ext

      - name: Publish to Chrome Web Store
        id: chrome
        if: github.event_name == 'push' || inputs.store == 'both' || inputs.store == 'chrome'
        run: bun scripts/publish-chrome.ts

      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && (success() || steps.chrome.outcome == 'failure') && (github.event_name == 'push' || inputs.store == 'both' || inputs.store == 'firefox') }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bun run sign:ext
